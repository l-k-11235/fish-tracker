name: CI Fish Tracker

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v3

      # Set up Python for linting
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # Install Black and Flake8
      - name: Install linters
        run: |
          pip install black flake8

      # Run Black
      - name: Run Black
        run: |
          black --check src/fish_tracker/

      # Run Flake8
      - name: Run Flake8
        run: |
          flake8 src/fish_tracker/

      # Build Docker image
      - name: Build Docker image
        run: |
          docker build -t fish-tracker-test -f docker/Dockerfile .

      # Run some minimal inferences to test the pipeline
      - name: Test 1 - selective search
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data/examples:/app/data \
            -v ${{ github.workspace }}/data/configs:/app/configs \
            fish-tracker-test \
            --config /app/configs/test1_selective_search.yaml
      - name: Test 2 - selective search + hybrid matching + reference frame
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data/examples:/app/data \
            -v ${{ github.workspace }}/data/configs:/app/configs \
            fish-tracker-test \
            --config /app/configs/test2_selective_search.yaml
      - name: Test 3 - yolo8n-seg
        run: |
          docker run --rm \
            -v ${{ github.workspace }}/data/examples:/app/data \
            -v ${{ github.workspace }}/data/configs:/app/configs \
            fish-tracker-test \
            --config /app/configs/test3_yolo_seg.yaml

